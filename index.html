<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense and Budget Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Expense and Budget Visualizer</h1>
        <div class="balance-display">
            <span class="balance-label">Total Balance:</span>
            <span class="balance-value" id="balance-value">$0.00</span>
        </div>
    </header>

    <main>
        <section class="input-form-section">
            <h2>Add New Transaction</h2>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="item-name">Item Name</label>
                    <input 
                        type="text" 
                        id="item-name" 
                        name="name" 
                        maxlength="100" 
                        placeholder="Enter item name"
                        required
                    >
                    <span class="error-message" id="name-error"></span>
                </div>

                <div class="form-group">
                    <label for="item-amount">Amount</label>
                    <input 
                        type="number" 
                        id="item-amount" 
                        name="amount" 
                        step="0.01" 
                        min="0.01" 
                        max="999999999.99"
                        placeholder="Enter amount"
                        required
                    >
                    <span class="error-message" id="amount-error"></span>
                </div>

                <div class="form-group">
                    <label for="item-category">Category</label>
                    <select id="item-category" name="category" required>
                        <option value="" disabled selected>Select a category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Fun">Fun</option>
                    </select>
                    <span class="error-message" id="category-error"></span>
                </div>

                <button type="submit" class="btn-submit">Add Transaction</button>
            </form>
        </section>

        <section class="transaction-list-section">
            <h2>Transaction History</h2>
            <div class="transaction-list-container">
                <ul id="transaction-list" class="transaction-list">
                    <li class="empty-state">No expenses have been recorded yet.</li>
                </ul>
            </div>
        </section>

        <section class="chart-section">
            <h2>Spending Distribution</h2>
            <div class="chart-container">
                <canvas 
                    id="spending-chart" 
                    width="400" 
                    height="400"
                    aria-label="Pie chart showing spending distribution by category: Food, Transport, and Fun"
                ></canvas>
                <p id="chart-unavailable" style="display:none;" aria-live="polite">Chart unavailable in this browser</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
